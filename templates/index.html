<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist Streaming</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(180deg, #eff6ff 0%, #f8fafc 100%);
            font-family: Arial, sans-serif;
            color: #0f172a;
        }

        .mobile-card {
            max-width: 540px;
            margin: 24px auto;
            border: none;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.12);
            overflow: hidden;
        }

        .card-header {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            border: none;
            font-weight: 700;
            padding: 16px 18px;
        }

        .card-body {
            padding: 18px 16px 20px;
        }

        .form-control {
            border-radius: 12px;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            font-size: 1rem;
        }

        .btn-primary-action {
            width: 100%;
            border-radius: 12px;
            padding: 12px 16px;
            font-weight: 700;
            margin-top: 8px;
        }

        @media (max-width: 480px) {
            .mobile-card {
                margin: 12px 8px;
            }
        }
    </style>
</head>

<body>
<div class="container">
    <div class="card mobile-card">
        <div class="card-header text-white">Nueva Verificación</div>
        <div class="card-body">
            <div class="mb-3">
                <label class="form-label fw-semibold">Evento</label>
                <input type="text" class="form-control" placeholder="Nombre del evento">
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Responsable</label>
                <input type="text" class="form-control" placeholder="Nombre del técnico">
            </div>

            <a href="{{ url_for('checklist_view') }}" class="btn btn-success btn-primary-action">
                Iniciar Checklist
            </a>
        </div>
    </div>
</div>
</body>
</html>
