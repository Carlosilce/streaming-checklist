<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checklist Streaming</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

    <!-- Bootstrap -->
    https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css
</head>

<body>

<div class="container mt-4">

    <div class="card">

        <div class="card-header bg-primary text-white">
            Nueva Verificación
        </div>

        <div class="card-body">

            <div class="mb-3">
                <label class="form-label">
                    Evento
                </label>

                <input type="text"
                       class="form-control"
                       placeholder="Nombre del evento">
            </div>

            <div class="mb-3">
                <label class="form-label">
                    Responsable
                </label>

                <input type="text"
                       class="form-control"
                       placeholder="Nombre del técnico">
            </div>

            <a href="{{ url_for('checklist') }}" class="btn btn-success">
                Iniciar Checklist
            </a>

        </div>

    </div>

</div>

</body>

</html>
