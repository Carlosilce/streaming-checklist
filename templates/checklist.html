<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <title>Checklist</title>
</head>

<body>

<div class="container mt-4">

    <h1 class="mb-4">
        Infraestructura y Hardware
    </h1>

    {% for item in infraestructura %}

    <div class="card mb-3">

        <div class="card-body">

            <h5>
                {{ item.id }} - {{ item.titulo }}
            </h5>

            <p>
                {{ item.descripcion }}
            </p>

            <button class="btn btn-success">
                OK
            </button>

            <button class="btn btn-danger">
                Falla
            </button>

            <button class="btn btn-secondary">
                N/A
            </button>

        </div>

    </div>

    {% endfor %}
    <!-- Aqui termina la seccion de infraestructura y empieza la de conectividad -->    
<h2 class="mt-5">
    Conectividad y Red
</h2>

{% for item in conectividad %}

<div class="card mb-3">

    <div class="card-body">

        <h5>
            {{ item.id }} - {{ item.titulo }}
        </h5>

        <p>
            {{ item.descripcion }}
        </p>

        <button class="btn btn-success">
            OK
        </button>

        <button class="btn btn-danger">
            Falla
        </button>

        <button class="btn btn-secondary">
            N/A
        </button>

    </div>

</div>

{% endfor %}

</div>

</body>

</html>
